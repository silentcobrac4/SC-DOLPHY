name: Build SC DOLPHY APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-source.zip'
      - '.github/workflows/build-release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "app-source.zip" ]; then
            echo "::error::app-source.zip is missing from the repository root. Upload your project ZIP there."
            exit 1
          fi
          unzip -t app-source.zip

      - name: Extract project ZIP
        run: |
          mkdir -p extracted-project
          unzip -q app-source.zip -d extracted-project

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE=$(find extracted-project -maxdepth 8 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside app-source.zip. Make sure the ZIP contains the Android project."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Find release APK
        id: apk
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Gradle finished but no release APK was found."
            exit 1
          fi
          echo "apk_path=${{ steps.project.outputs.project_dir }}/$APK_FILE" >> "$GITHUB_OUTPUT"
          echo "APK created: $APK_FILE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC-DOLPHY-release-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
