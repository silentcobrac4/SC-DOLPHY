name: Build SC DOLPHIN APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SC_DOLPHIN_Source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f SC_DOLPHIN_Source.zip
          mkdir -p extracted
          unzip -q SC_DOLPHIN_Source.zip -d extracted
          test -f extracted/settings.gradle.kts
          cp -a extracted/. .
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-DOLPHIN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
